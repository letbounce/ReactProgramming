<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація - КП "TroyBus"</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-large">
                    <h1>КП "TroyBus"</h1>
                    <p>Система управління дорожніми листами</p>
                </div>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Логін</label>
                    <input type="text" class="form-input" id="username" required placeholder="Введіть логін">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" class="form-input" id="password" required placeholder="Введіть пароль">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="userRole">Роль користувача</label>
                    <select class="form-select" id="userRole" required>
                        <option value="">Оберіть роль</option>
                        <option value="dispatcher">Диспетчер</option>
                        <option value="driver">Водій</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Увійти</button>
                
                <div class="login-help">
                    <p>В разі втрати доступу зверніться до адміністратора системи</p>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const role = document.getElementById('userRole').value;
            
            if (role === 'dispatcher') {
                window.location.href = 'daily-schedule.html';
            } else if (role === 'driver') {
                window.location.href = 'waybill-form.html';
            }
        });
    </script>
</body>
</html>
